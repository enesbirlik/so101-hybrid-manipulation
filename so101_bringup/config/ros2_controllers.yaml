controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    torque_controller:
      type: forward_command_controller/ForwardCommandController
    gripper_torque_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    # A new goal starts from the last COMMAND, not from the measured position. The servos hold a static
    # error of ~0.5 deg (friction, sag); starting each goal from the measured pose made the reference
    # jump and briefly run backwards (shoulder_lift reversed twice per descent: backlash knocks, 2026-11-23).
    interpolate_from_desired_state: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0

gripper_controller:
  ros__parameters:
    joints: [gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

# /torque_controller/commands (std_msgs/Float64MultiArray): [1.0] torque on, [0.0] off.
# After switching it back on, restart arm_controller and gripper_controller so they command the
# present pose; until then the hardware holds the pose the torque came on at.
torque_controller:
  ros__parameters:
    joints: [torque]
    interface_name: enable

# /gripper_torque_controller/commands (std_msgs/Float64MultiArray): the gripper servo's torque limit,
# 0.1 % units: [250.0] = 25 %. Clamped to 0..the gripper's torque_limit parameter (default 1000), so
# [1000.0] restores it. Applied before the next goal position; it stays until changed (also after
# this controller is deactivated) and is reset to the parameter when the hardware is activated.
gripper_torque_controller:
  ros__parameters:
    joints: [gripper]
    interface_name: torque_limit
