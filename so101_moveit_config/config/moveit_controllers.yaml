# The controllers in so101_bringup/config/ros2_controllers.yaml
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [gripper]

trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 1.0
  # The servos hold a few degrees behind their goal under load (P 16); 0.05 rad rejected
  # executions after shoulder_lift settled between plan and execute (2026-11-01).
  allowed_start_tolerance: 0.1
